.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,10,18,.82) 0%,rgba(2,10,18,.42) 48%,rgba(2,10,18,.12) 100%),linear-gradient(0deg,rgba(2,10,18,.65),transparent 55%);pointer-events:none}
.hero:after{content:"";position:absolute;inset:0;border-bottom:1px solid #ffffff22;pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:1120px;width:100%;margin:0 auto;display:block}
.eyebrow{font-size:12px;letter-spacing:.32em;color:#72cafa;font-weight:800;margin-bottom:22px}
h1{font-size:clamp(40px,6.3vw,78px);line-height:1.12;letter-spacing:-.04em;margin:0 0 22px;font-weight:850;text-shadow:0 3px 20px #0008}
h1 em{font-style:normal;color:#39a9e8}
.hero-copy p{font-size:16px;line-height:2;color:#e0e9f0;max-width:570px;margin:0 0 30px;text-shadow:0 2px 12px #0008}
.cta{display:inline-flex;align-items:center;gap:20px;border:1px solid #75cafa;padding:14px 22px;color:#fff;font-size:13px;letter-spacing:.08em;transition:.25s;background:#071a2b55}
.cta:hover{background:#167db7}
.section{padding:105px clamp(22px,8vw,120px);position:relative;overflow:hidden}
.section-inner{max-width:1120px;margin:0 auto;position:relative;z-index:1}
.white-section{background:#fff}.white-section:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 17%,#f3f6fa 17.1% 17.8%,transparent 17.9%),linear-gradient(45deg,transparent 0 78%,#f3f6fa 78.1% 79%,transparent 79.1%);opacity:.9}
.blue-section{background:linear-gradient(135deg,#edf4fc,#e8f1fb)}
.blue-section:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 48%,#dce8f6 48.1% 49%,transparent 49.1%),linear-gradient(45deg,transparent 72%,#dce8f6 72.1% 73%,transparent 73.1%);background-size:440px 440px;opacity:.55}
.intro-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:80px;align-items:center;min-height:170px}
.kicker{font-size:11px;letter-spacing:.25em;color:var(--blue);font-weight:800;margin-bottom:16px}
.intro-grid h2{font-size:clamp(23px,3vw,34px);line-height:1.45;margin:0;font-weight:750}
.intro-text{font-size:14px;line-height:2.2;color:#596777}
.intro-text p{margin:0 0 10px}
.section-head{margin-bottom:42px}.section-head .kicker{margin-bottom:12px}
.section-head h2{font-size:clamp(28px,4vw,44px);margin:0 0 12px;letter-spacing:-.03em}
.section-head p{color:var(--muted);font-size:14px;line-height:1.9;max-width:660px;margin:0}
.harm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.harm-card{background:#ffffffd9;border:1px solid #dce6f1;padding:30px 25px;min-height:245px;box-shadow:0 12px 35px #264a6810;transition:.25s}
.harm-card:hover{transform:translateY(-5px);box-shadow:0 18px 42px #264a6820}
.num{font-size:12px;letter-spacing:.2em;color:#1784c1;font-weight:800}
.harm-card h3{font-size:21px;margin:26px 0 14px}.harm-card p{font-size:13px;color:#667485;line-height:2;margin:0}
.definition{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}
.definition-visual{background:var(--navy);min-height:310px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:30px}
.definition-visual:before{content:"";position:absolute;width:300px;height:300px;border:1px solid #2c83b2;border-radius:50%;box-shadow:0 0 0 24px #ffffff08,0 0 0 48px #ffffff06}
.definition-visual img{position:relative;width:min(75%,270px);border-radius:50%;mix-blend-mode:normal}
.definition-copy h2{font-size:clamp(27px,4vw,40px);margin:0 0 20px}.definition-copy p{font-size:14px;line-height:2.1;color:#657384}
.quote{border-left:3px solid #1685c1;padding:4px 0 4px 18px;color:#344657;font-weight:650;margin-top:24px;line-height:1.9}
.principles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.principle{padding:26px 20px;background:#fff;border-top:3px solid #1685c1;min-height:200px}
.principle span{font-size:10px;color:#1685c1;letter-spacing:.18em;font-weight:800}
.principle h3{font-size:19px;margin:22px 0 10px}.principle p{font-size:12px;color:#6d7b89;line-height:1.9;margin:0}
.feature{background:#071a2b;color:#fff;padding:0;display:grid;grid-template-columns:1fr 1fr;min-height:360px}
.feature-image{min-height:360px;background:linear-gradient(135deg,#0e3551,#071a2b);display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden}
.feature-image img{width:min(75%,330px);border-radius:50%;box-shadow:0 20px 70px #0008}
.feature-copy{padding:70px clamp(25px,7vw,90px);align-self:center}
.feature-copy .kicker{color:#64c5ef}.feature-copy h2{font-size:clamp(27px,4vw,42px);margin:0 0 18px}.feature-copy p{color:#bdcbd8;font-size:14px;line-height:2}
.footer{background:#04111e;color:#9baab8;padding:35px 22px;text-align:center;font-size:11px;letter-spacing:.08em}
.footer strong{color:#fff;display:block;font-size:14px;margin-bottom:10px}
@media(max-width:760px){
 .topbar{height:58px;padding:0 17px}.brand{font-size:12px}.brand img{width:36px;height:36px}
 .menu{display:block}.nav{display:none;position:absolute;top:58px;left:0;right:0;background:#071a2b;padding:20px 24px;flex-direction:column;gap:20px}.nav.open{display:flex}
 .hero{height:auto;min-height:690px;padding:105px 22px 58px;align-items:flex-end;background-position:center center}
 .hero-inner{display:block}.hero-copy p{font-size:14px}
 .section{padding:72px 22px}.intro-grid,.definition{grid-template-columns:1fr;gap:25px}.intro-grid{min-height:0}.intro-text{font-size:13px}
 .harm-grid{grid-template-columns:1fr;gap:12px}.harm-card{min-height:0;padding:24px}.harm-card h3{margin:17px 0 8px}
 .principles{grid-template-columns:1fr 1fr;gap:10px}.principle{min-height:175px;padding:20px 15px}
 .feature{grid-template-columns:1fr}.feature-image{min-height:250px}.feature-copy{padding:42px 25px}
}
@media(max-width:390px){.principles{grid-template-columns:1fr}h1{font-size:38px}}

/* XYC 招募、公告与员工中心 */
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cta.secondary{border-color:#ffffff88;background:#ffffff12}
.portal-section{background:#f4f8fc;padding:78px clamp(20px,7vw,100px)}
.portal-inner{max-width:980px;margin:auto}
.portal-card{background:#fff;border:1px solid #dce6f1;border-radius:16px;padding:clamp(20px,4vw,36px);box-shadow:0 16px 45px #193b5810}
.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.portal-field{display:flex;flex-direction:column;gap:7px;margin:0 0 15px}
.portal-field label{font-size:13px;font-weight:700;color:#33475a}
.portal-field input,.portal-field textarea,.portal-field select{width:100%;border:1px solid #d5e0eb;border-radius:9px;padding:12px 13px;font:inherit;font-size:14px;background:#fbfdff;color:#172b3d;outline:none}
.portal-field input:focus,.portal-field textarea:focus{border-color:#1685c1;box-shadow:0 0 0 3px #1685c118}
.portal-field textarea{min-height:100px;resize:vertical;line-height:1.7}
.portal-submit{border:0;border-radius:9px;background:#0c6fa8;color:#fff;padding:13px 20px;font-weight:700;cursor:pointer}
.portal-submit:disabled{opacity:.55;cursor:wait}
.portal-note,.portal-status{font-size:12px;color:#718092;line-height:1.8}
.portal-status{margin-top:12px;min-height:22px}

.notice-marquee{position:absolute;top:64px;left:0;right:0;z-index:4;height:42px;display:flex;align-items:center;overflow:hidden;background:rgba(7,26,43,.76);border-bottom:1px solid #ffffff22;color:#eaf6ff}
.notice-label{flex:0 0 auto;padding:0 15px;font-size:11px;font-weight:800;letter-spacing:.12em;color:#8dd8ff;border-right:1px solid #ffffff30}
.notice-window{min-width:0;overflow:hidden;flex:1}
.notice-track{display:flex;align-items:center;gap:54px;width:max-content;white-space:nowrap;animation:xyc-marquee 28s linear infinite;padding-left:24px}
.notice-track:hover{animation-play-state:paused}
.notice-track a{font-size:12px;color:#f3f8fc;opacity:.94}
.notice-track a:before{content:"◆";font-size:8px;color:#70c8f4;margin-right:10px}
.notice-empty{font-size:12px;color:#d3e2ee;padding-left:18px}
@keyframes xyc-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.ticket-step{border:1px solid #e1e9f1;border-radius:9px;padding:10px;background:#f8fbfe;font-size:12px;line-height:1.7;color:#5e6e7d}
.ticket-step b{display:block;color:#1b3448;margin-bottom:3px}
.ticket-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ticket-actions button,.announcement-admin-actions button{border:1px solid #d6e1eb;border-radius:7px;background:#fff;padding:8px 11px;font-size:12px;cursor:pointer;color:#23445e}
.ticket-actions button.primary{background:#0c6fa8;color:#fff;border-color:#0c6fa8}
.ticket-actions button.danger{color:#a33b3b;border-color:#e7caca}
.ticket-actions button:disabled{opacity:.45;cursor:not-allowed}
.ticket-status{font-size:12px;color:#647789;line-height:1.8;margin-top:8px}
.announcement-admin-list{display:grid;gap:8px;margin-top:14px}
.announcement-admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid #e3eaf1;border-radius:8px;font-size:12px}
.announcement-admin-actions{display:flex;gap:6px;flex-shrink:0}
@media(max-width:650px){.ticket-grid{grid-template-columns:1fr}.notice-label{padding:0 10px}.notice-track{gap:32px}}

.announcement-list{display:grid;gap:12px;margin-top:22px}
.announcement-item{padding:17px 18px;background:#f7faff;border:1px solid #e0eaf4;border-radius:11px}
.announcement-item h3{font-size:16px;margin:0 0 8px;color:#18344b}
.announcement-item p{font-size:13px;line-height:1.9;color:#5d6c7a;white-space:pre-wrap;margin:0}
.announcement-item time{display:block;font-size:11px;color:#8a98a7;margin-top:10px}
.staff-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.staff-list{display:grid;gap:12px}
.staff-row{border:1px solid #e0e8f0;border-radius:10px;padding:15px;background:#fff}
.staff-row strong{font-size:14px}
.staff-row p{font-size:13px;line-height:1.8;color:#607080;white-space:pre-wrap}
.staff-row select{padding:7px;border:1px solid #d5e0eb;border-radius:7px}
.staff-row a{color:#0877b5;text-decoration:underline;font-size:13px}
.hidden{display:none!important}
@media(max-width:650px){.portal-grid{grid-template-columns:1fr}.hero-actions{align-items:stretch;flex-direction:column;width:max-content;max-width:100%}.hero-actions .cta{justify-content:space-between}}


/* XYC 全局轻量动效与可访问性 */
@media (prefers-reduced-motion: no-preference){
 body{animation:xyc-page-in .42s ease both}
 .portal-card,.announcement-item,.staff-row,.harm-card,.principle,.feature{animation:xyc-rise .55s cubic-bezier(.2,.7,.2,1) both}
 .portal-submit,.cta,.btn,.ticket-actions button,.nav a{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,opacity .2s ease}
 .portal-submit:hover,.cta:hover,.btn:hover,.ticket-actions button:hover{transform:translateY(-2px);box-shadow:0 8px 22px #0b426022}
 .portal-field input:focus,.portal-field textarea:focus{transition:box-shadow .2s ease,border-color .2s ease}
 .modal-card{animation:xyc-pop .24s ease both}
}
@keyframes xyc-page-in{from{opacity:.82}to{opacity:1}}
@keyframes xyc-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes xyc-pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.notice-track{animation-duration:var(--marquee-duration,42s)!important}
.notice-track a{white-space:nowrap}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,17,31,.68);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(7px)}
.modal-backdrop.open{display:flex}
.modal-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 24px 80px #0004;text-align:center}
.verification-code{font-size:34px;letter-spacing:.18em;font-weight:900;color:#0c6fa8;background:#eef7ff;border:1px dashed #8bbfe0;border-radius:14px;padding:18px 12px;margin:18px 0;font-family:ui-monospace,monospace;word-break:break-all}
.admin-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:20px 0}
.admin-tab{border:1px solid #dce6f1;background:#f7faff;color:#53677a;border-radius:13px;padding:13px 6px;font-weight:800;cursor:pointer;min-width:0}
.admin-tab.active{background:#2878df;color:#fff;border-color:#2878df;box-shadow:0 7px 18px #2878df30}
.admin-view{display:none}.admin-view.active{display:block;animation:xyc-rise .25s ease both}
.admin-view h3{margin:8px 0 16px}.admin-list{display:grid;gap:12px}.admin-summary{border:1px solid #e1e9f1;border-radius:13px;padding:15px;background:#fff;line-height:1.8;font-size:13px}
.admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.admin-refresh{border:1px solid #cbd9e8;border-radius:10px;background:#fff;color:#31516c;padding:9px 13px;font-weight:700;cursor:pointer}
@media(max-width:520px){.admin-tabs{gap:5px}.admin-tab{font-size:12px;padding:11px 2px;border-radius:10px}.modal-card{padding:23px 18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

const SUPABASE_URL='https://zvzmjgzstmlelvslanwh.supabase.co';
const SUPABASE_KEY='sb_publishable_vRASiRnolylqO-xPdAaFvA_BVxfKc3J';
let db=null, currentUser=null, currentProfile=null;
const $=id=>document.getElementById(id);
const say=(id,msg)=>{const el=$(id);if(el)el.textContent=msg};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadSdk(){
 if(window.supabase?.createClient)return true;
 for(const src of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js']){
  try{await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src=src;sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});if(window.supabase?.createClient)return true}catch(e){}

}
async function loadAnnouncements(){
 const ticker=$('announcementTicker');
 if(!ticker)return;
 if(!db){ticker.innerHTML='<div class="notice-empty">云端服务暂不可用</div>';return}
 const {data,error}=await db.from('xyc_announcements').select('id,title,body,created_at').eq('is_published',true).order('created_at',{ascending:false}).limit(30);
 if(error){ticker.innerHTML='<div class="notice-empty">公告暂时无法加载</div>';return}
 if(!data?.length){ticker.innerHTML='<div class="notice-empty">暂无组织公告</div>';return}
 const bits=data.map(x=>`<a href="#home" title="${esc(x.body)}">${esc(x.title)}：${esc(x.body)}</a>`).join('');
 ticker.innerHTML=`<div class="notice-track">${bits}${bits}</div>`;
 const track=ticker.querySelector('.notice-track'); if(track){const px=track.scrollWidth/2; track.style.setProperty('--marquee-duration',Math.max(36,px/34)+'s');}
 if(currentProfile?.role==='admin'&&$('adminAnnouncementList')){
  $('adminAnnouncementList').innerHTML=data.map(x=>`<div class="announcement-admin-row"><span><b>${esc(x.title)}</b></span><span class="announcement-admin-actions"><button type="button" data-edit-ann="${esc(x.id)}">编辑</button><button type="button" data-delete-ann="${esc(x.id)}">删除</button></span></div>`).join('');
  $('adminAnnouncementList').querySelectorAll('[data-edit-ann]').forEach(b=>b.addEventListener('click',async()=>{
   const item=data.find(x=>x.id===b.dataset.editAnn);if(!item)return;
   const title=prompt('修改公告标题',item.title);if(title===null)return;
   const body=prompt('修改公告内容',item.body);if(body===null)return;
   const {error}=await db.from('xyc_announcements').update({title:title.trim(),body:body.trim(),updated_at:new Date().toISOString()}).eq('id',item.id);
   if(error)alert('修改失败：'+error.message);else await loadAnnouncements();
  }));
  $('adminAnnouncementList').querySelectorAll('[data-delete-ann]').forEach(b=>b.addEventListener('click',async()=>{
   if(!confirm('确定删除这条公告吗？'))return;
   const {error}=await db.from('xyc_announcements').delete().eq('id',b.dataset.deleteAnn);
   if(error)alert('删除失败：'+error.message);else await loadAnnouncements();
  }));
 }
}

async function loadProfile(){
 if(!currentUser){currentProfile=null;return}
 const {data,error}=await db.from('staff_members').select('role,display_name').eq('user_id',currentUser.id).maybeSingle();
 if(error||!data){await db.auth.signOut();currentProfile=null;throw new Error('该账号尚未登记员工权限，请联系管理员。')}
 currentProfile=data;
}
function renderStaff(){
 const logged=!!currentUser&&!!currentProfile;
 if(!$('loginCard')||!$('staffPanel'))return;
 $('loginCard').classList.toggle('hidden',logged);
 $('staffPanel').classList.toggle('hidden',!logged);
 if(!logged)return;
 $('staffWelcome').textContent=`欢迎，${currentProfile.display_name||'XYC员工'}`;
 $('staffRole').textContent=currentProfile.role==='admin'?'管理员权限':'普通员工权限';
 $('adminComposer').classList.toggle('hidden',currentProfile.role!=='admin');
 loadAnnouncements();
 loadApplications();
}
async function runTicketAction(id,action){
 const {error}=await db.rpc('xyc_update_recruit_ticket',{p_application_id:id,p_action:action});
 if(error){alert('工单操作失败：'+error.message);return false}
 await loadApplications();return true;
}
async function loadApplications(){
 const host=$('applicationList');
 if(!host||!currentProfile)return;
 const {data,error}=await db.from('xycrecruit_applications').select('*').order('created_at',{ascending:false}).limit(100);
 if(error){host.innerHTML='<div class="portal-note">申请列表加载失败。请先在 Supabase 执行随压缩包提供的数据库升级 SQL。</div>';return}
 if(!data?.length){host.innerHTML='<div class="portal-note">目前没有招募申请。</div>';return}
 host.innerHTML='';
 for(const a of data){
  let fileLink='未上传';
  if(a.evidence_path){const {data:link}=await db.storage.from('xyc-evidence').createSignedUrl(a.evidence_path,300);if(link?.signedUrl)fileLink=`<a href="${esc(link.signedUrl)}" target="_blank" rel="noopener">查看素材（5分钟有效）</a>`}
  const decision=v=>v==='approved'?'已同意':v==='rejected'?'已拒绝':'待确认';
  const contact=a.contact_status==='success'?'联系成功':a.contact_status==='failed'?'联系未成功':'尚未联系';
  const row=document.createElement('article');row.className='staff-row';
  row.innerHTML=`<strong>${esc(a.ticket_no||('XYC-'+String(a.id).slice(0,8).toUpperCase()))} · ${esc(a.nickname||'未填写称呼')} · QQ ${esc(a.qq)} · UID ${esc(a.uid)}</strong><p><b>加入原因：</b>${esc(a.reason)}<br><b>特长贡献：</b>${esc(a.skills)}<br><b>对反蛋仔行为的了解：</b>${esc(a.understanding)}<br><b>素材：</b>${fileLink}<br><b>提交时间：</b>${new Date(a.created_at).toLocaleString('zh-CN')}</p>
   <div class="ticket-grid"><div class="ticket-step"><b>管理员审批</b>${decision(a.admin_decision)}${a.admin_reviewed_at?' · '+new Date(a.admin_reviewed_at).toLocaleString('zh-CN'):''}</div><div class="ticket-step"><b>普通员工审批</b>${decision(a.staff_decision)}${a.staff_reviewed_at?' · '+new Date(a.staff_reviewed_at).toLocaleString('zh-CN'):''}</div><div class="ticket-step"><b>联系申请人</b>${contact}${a.contact_confirmed_at?' · '+new Date(a.contact_confirmed_at).toLocaleString('zh-CN'):''}</div><div class="ticket-step"><b>最终工单状态</b>${a.status==='completed'?'已完结':a.status==='rejected'?'已拒绝':a.admin_decision==='approved'&&a.staff_decision==='approved'&&a.contact_status==='success'?'待最终确认':'处理中'}</div></div>`;
  const actions=document.createElement('div');actions.className='ticket-actions';
  const add=(label,action,cls='')=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls;b.disabled=a.status==='completed'||a.status==='rejected';b.addEventListener('click',()=>runTicketAction(a.id,action));actions.appendChild(b)};
  if(currentProfile.role==='admin'){
   add('管理员同意','admin_approve','primary');add('管理员拒绝','admin_reject','danger');
  }else{
   add('普通员工同意','staff_approve','primary');add('普通员工拒绝','staff_reject','danger');
  }
  // 普通员工负责联系；管理员（超级管理员）也可代为完成联系确认。
  add('联系成功','contact_success','primary');add('联系未成功','contact_failed');
  const canFinalize=a.admin_decision==='approved'&&a.staff_decision==='approved'&&a.contact_status==='success'&&a.status!=='completed'&&a.status!=='rejected';
  if(canFinalize){const b=document.createElement('button');b.type='button';b.textContent='确认录取并完结工单';b.className='primary';b.addEventListener('click',async()=>{if(confirm('确认双方审批均同意、联系成功，并将申请人正式录取？此操作会完结工单。'))await runTicketAction(a.id,'finalize')});actions.appendChild(b)}
  row.appendChild(actions);
  const note=document.createElement('div');note.className='ticket-status';note.textContent='审批规则：管理员与一名普通员工必须分别同意；联系成功后才可最终录取。所有操作均由数据库记录操作人和时间。';row.appendChild(note);
  host.appendChild(row);
 }
}
if($('recruitForm')){
$('recruitForm').addEventListener('submit',async e=>{
 e.preventDefault();const f=$('rEvidence').files[0],button=$('recruitSubmit');
 if(!db){say('recruitStatus','云端服务尚未连接，请刷新页面后重试。');return}
 if(!f){say('recruitStatus','请先选择举报素材。');return}
 if(f.size<=0||f.size>104857600){say('recruitStatus','文件必须大于 0 且不超过 100MB。');return}
 const allowed=['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime'];
 if(!allowed.includes(f.type)){say('recruitStatus','仅支持 JPG、PNG、WEBP、GIF、MP4、WEBM、MOV 格式。');return}
 button.disabled=true;say('recruitStatus','正在安全上传素材并提交申请…');
 const path=`applications/${Date.now()}-${crypto.randomUUID()}-${f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,'_')}`;
 const up=await db.storage.from('xyc-evidence').upload(path,f,{contentType:f.type,upsert:false});
 if(up.error){say('recruitStatus','素材上传失败：'+up.error.message);button.disabled=false;return}
 const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';let verificationCode='';const random=new Uint32Array(6);crypto.getRandomValues(random);for(const n of random)verificationCode+=alphabet[n%alphabet.length];
 const payload={nickname:$('rNickname').value.trim(),reason:$('rReason').value.trim(),skills:$('rSkills').value.trim(),understanding:$('rUnderstanding').value.trim(),qq:$('rQQ').value.trim(),uid:$('rUID').value.trim(),evidence_path:path,evidence_name:f.name,evidence_type:f.type,evidence_size:f.size,status:'pending',verification_code:verificationCode};
 const {error}=await db.from('xycrecruit_applications').insert(payload);
 if(error){say('recruitStatus','申请提交失败：'+error.message+'（素材已上传，可稍后联系管理员清理）');button.disabled=false;return}
 $('recruitForm').reset();say('recruitStatus','提交成功！请保存你的校验码。');$('verificationCodeValue').textContent=verificationCode;$('verificationModal').classList.add('open');button.disabled=false;
});
}
function accountNameToAuthEmail(name){
 // 英文账户名保持旧规则，确保已有 xycadmin@test.com 等账户不受影响。
 // 中文账户名使用 UTF-8 字节十六进制编码，生成稳定的内部登录邮箱；用户无需看到或输入邮箱。
 if(/^[a-zA-Z0-9._-]{3,32}$/.test(name)) return `${name.toLowerCase()}@test.com`;
 if(!/^[\u3400-\u9fffA-Za-z0-9._-]{2,32}$/.test(name)) return null;
 const bytes=new TextEncoder().encode(name.normalize('NFC'));
 const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
 return `cn-${hex}@xyc-login.invalid`;
}
if($('loginForm')){
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const name=$('loginName').value.trim(),password=$('loginPassword').value,button=$('loginSubmit');
 const email=accountNameToAuthEmail(name);
 if(!email){say('loginStatus','账户名请使用 2–32 位中文、英文、数字或 . _ -。');return}
 if(!password){say('loginStatus','请输入密码。');return}
 if(!db){say('loginStatus','云端服务尚未连接，请刷新页面后重试。');return}
 button.disabled=true;say('loginStatus','正在验证账户…');
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){say('loginStatus','登录失败：请检查账户名和密码，或确认管理员已创建对应账户。');button.disabled=false;return}
 currentUser=data.user;
 try{await loadProfile();say('loginStatus','登录成功');renderStaff()}catch(err){say('loginStatus',err.message)}
 button.disabled=false;
});
}
if($('logoutBtn')){
$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();currentUser=null;currentProfile=null;renderStaff();say('loginStatus','已退出登录。')});
}
if($('announcementForm')){
$('announcementForm').addEventListener('submit',async e=>{
 e.preventDefault();if(currentProfile?.role!=='admin')return;
 const button=e.submitter;button.disabled=true;
 const {error}=await db.from('xyc_announcements').insert({title:$('aTitle').value.trim(),body:$('aBody').value.trim(),is_published:true,created_by:currentUser.id});
 if(error)say('announcementStatus','发布失败：'+error.message);
 else{$('announcementForm').reset();say('announcementStatus','公告发布成功。');await loadAnnouncements()}
 button.disabled=false;
});
}
(async()=>{
 if(!await loadSdk()){say('loginStatus','Supabase SDK 加载失败，请检查网络。');say('recruitStatus','云端服务加载失败，请刷新页面重试。');return}
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 await loadAnnouncements();
 const {data:{session}}=await db.auth.getSession();
 if(session?.user){currentUser=session.user;try{await loadProfile();renderStaff()}catch(e){say('loginStatus',e.message)}}
 db.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(!currentUser){currentProfile=null;renderStaff();return}try{await loadProfile();renderStaff()}catch(e){say('loginStatus',e.message)}});
})();


});
